name: Build and test

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Fetch the pinned WebView2 SDK
        shell: pwsh
        run: ./scripts/Get-WebView2Sdk.ps1

      - name: Build core, inspect tool, Windows host, and tests
        shell: cmd
        run: scripts\dev-build.cmd Release -DLEANSLIDES_ENABLE_GUI_TESTS=ON

      - name: Run core, host logic, and WebView2 smoke tests
        shell: pwsh
        run: ctest --test-dir build/Release --output-on-failure

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check that the executables import no C runtime DLL
        run: node tests/hosts/check-imports.mjs build/Release/LeanSlides.exe build/Release/tools/inspect/leanslides-inspect.exe

      - name: Draw every corpus slide in Edge and compare it with its model
        shell: pwsh
        env:
          LEANSLIDES_INSPECT: build/Release/tools/inspect/leanslides-inspect.exe
          LEANSLIDES_REQUIRE_CORPUS: "1"
        run: |
          npm ci --ignore-scripts
          node tests/corpus/fetch-corpus.mjs
          node --test "tests/reader/*.test.mjs"

      # The runner's WebView2 ignores WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS,
      # so the net log cannot be turned on here; see docs/HOST.md#network.
      - name: Watch the network while decks are open
        shell: pwsh
        run: ./tests/hosts/Observe-Network.ps1 -ExePath build/Release/LeanSlides.exe -SocketsOnly

      - name: Resolve the release version
        id: package
        shell: pwsh
        env:
          LEANSLIDES_REF_TYPE: ${{ github.ref_type }}
          LEANSLIDES_REF_NAME: ${{ github.ref_name }}
        run: |
          $manifestVersion = [string](Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $version = $manifestVersion
          if ($env:LEANSLIDES_REF_TYPE -eq 'tag') {
            if (-not $env:LEANSLIDES_REF_NAME.StartsWith('v')) {
              throw ('Release tags must start with v: {0}' -f $env:LEANSLIDES_REF_NAME)
            }
            $version = $env:LEANSLIDES_REF_NAME.Substring(1)
            if ($version -cne $manifestVersion) {
              throw ('Tag version {0} does not match package.json version {1}.' -f $version, $manifestVersion)
            }
          }
          ('version={0}' -f $version) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # The tree is already built and tested above, so build.ps1 only stages
      # dist\ here.
      - name: Stage and package the release ZIP
        shell: pwsh
        run: |
          ./scripts/build.ps1 -SkipTests
          ./scripts/package-release.ps1 -Version '${{ steps.package.outputs.version }}'

      - name: Install, launch, and uninstall the release ZIP
        shell: pwsh
        run: |
          $zip = (Get-Item release/*.zip | Select-Object -First 1).FullName
          ./tests/hosts/Test-WindowsLifecycle.ps1 -ZipPath $zip

      - name: Upload the Windows package
        uses: actions/upload-artifact@v7
        with:
          name: LeanSlides-v${{ steps.package.outputs.version }}-windows-x64
          path: |
            release/*.zip
            release/*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  linux-core:
    name: Linux core (portability)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build and test the portable core
        run: |
          sudo apt-get install -y --no-install-recommends ninja-build
          cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/linux
          ctest --test-dir build/linux --output-on-failure

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Fetch the public corpus and run the core over it
        run: |
          node tests/corpus/fetch-corpus.mjs
          node tests/corpus/run-corpus.mjs --inspect build/linux/tools/inspect/leanslides-inspect

      - name: Compare slide models with PowerPoint's measurements
        run: node tests/model/check-model.mjs --inspect build/linux/tools/inspect/leanslides-inspect

      - name: Test the shape geometry
        run: node --test tests/reader/geometry.test.mjs

      - name: Test the parity scores
        run: node --test tests/parity/score.test.mjs

      - name: Check that assets/presets.json matches the pinned source
        run: |
          node tools/presets/convert-presets.mjs
          git diff --exit-code assets/presets.json

      - name: Check versions, release notes, installer lists, and wording
        run: node scripts/Test-ReleaseEngineering.mjs

  release:
    name: Publish one verified release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs:
      - windows
      - linux-core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Build provenance attestations: a signing identity from GitHub's OIDC
      # token and write access to the repository's attestation store.
      id-token: write
      attestations: write
    steps:
      - name: Check out the release notes
        uses: actions/checkout@v7

      - name: Download the Windows package
        uses: actions/download-artifact@v7
        with:
          pattern: LeanSlides-v${{ needs.windows.outputs.version }}-*
          path: release-assets
          merge-multiple: true

      - name: Verify the artifact set and checksums
        shell: bash
        env:
          LEANSLIDES_VERSION: ${{ needs.windows.outputs.version }}
        run: |
          expected=(
            "LeanSlides-v${LEANSLIDES_VERSION}-windows-x64.zip"
            "LeanSlides-v${LEANSLIDES_VERSION}-windows-x64.zip.sha256"
          )
          for file in "${expected[@]}"; do
            test -f "release-assets/$file"
          done
          test "$(ls release-assets | wc -l)" -eq "${#expected[@]}"
          (
            cd release-assets
            sha256sum -c *.sha256
          )

      # Records that this exact ZIP was built by this workflow from this tag,
      # so a download can be checked with `gh attestation verify`.
      - name: Attest build provenance of the release ZIP
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*.zip

      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LEANSLIDES_TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${LEANSLIDES_TAG}.md"
          test -f "$notes"
          gh release create "$LEANSLIDES_TAG" \
            release-assets/* \
            --verify-tag \
            --latest \
            --title "LeanSlides $LEANSLIDES_TAG" \
            --notes-file "$notes"
