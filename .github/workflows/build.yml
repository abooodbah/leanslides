name: Build and test

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Fetch the pinned WebView2 SDK
        shell: pwsh
        run: ./scripts/Get-WebView2Sdk.ps1

      - name: Build core, inspect tool, Windows host, and tests
        shell: cmd
        run: scripts\dev-build.cmd Release -DLEANSLIDES_ENABLE_GUI_TESTS=ON

      - name: Run core, host logic, and WebView2 smoke tests
        shell: pwsh
        run: ctest --test-dir build/Release --output-on-failure

  linux-core:
    name: Linux core (portability)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build and test the portable core
        run: |
          sudo apt-get install -y --no-install-recommends ninja-build
          cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/linux
          ctest --test-dir build/linux --output-on-failure

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Fetch the public corpus and run the core over it
        run: |
          node tests/corpus/fetch-corpus.mjs
          node tests/corpus/run-corpus.mjs --inspect build/linux/tools/inspect/leanslides-inspect

      - name: Compare slide models with PowerPoint's measurements
        run: node tests/model/check-model.mjs --inspect build/linux/tools/inspect/leanslides-inspect
