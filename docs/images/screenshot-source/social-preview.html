<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LeanSlides social preview</title>
<style>
  @font-face { font-family: "Plex Sans"; src: url("../../../site/assets/fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Plex Sans"; src: url("../../../site/assets/fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); font-weight: 400; }

         display: grid; grid-template-columns: 470px 1fr; align-items: center; }
  .text { padding: 0 40px 0 64px; }

  h1 { font-size: 34px; line-height: 1.25; font-weight: 600; margin: 36px 0 18px; }
  p { font-size: 22px; line-height: 1.45; color: #d6d2c8; margin: 0; }
  .shot { width: 760px; height: 475px; border-radius: 10px; overflow: hidden;
          box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45); }
  .shot img { width: 760px; height: 475px; display: block; }
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><img src="../../../site/assets/leanslides-icon.png" alt="">LeanSlides</div>
    <h1>Read and present .pptx files without an office suite.</h1>
    <p>Free and MIT licensed for Windows. Macros never run, and nothing a file links to is fetched.</p>
  </div>
  <div class="shot"><img src="../../../site/assets/leanslides-window.png" alt=""></div>
